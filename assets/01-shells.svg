<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="700" viewBox="0 0 1500 700" role="img">
<title>Equal draws, unequal shell volumes</title><desc>Schematic high-dimensional shell cross-section and exact scale ratios for d=100. Both scales have 72 raw draws. Doubling sigma multiplies shell volume by 2^100, the squared-noise loss weight by four, and the effective mean component shell density by 2^-98. The drawing represents ambient geometry; radial probability mass is not density.</desc>
